<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tic Tac Toe · Tiny Arcade</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <a href="index.html" class="logo">Tiny Arcade</a>
    <div class="topright">
      <span class="pill" id="online-count">● 0 online</span>
      <button disabled title="Coming soon">Sign in</button>
    </div>
  </div>

  <div class="gamehead"><h1>❌ Tic Tac Toe</h1></div>

  <!-- Mode and bot level selectors -->
  <div class="panel glass">
    <div class="row"><b>Mode</b>
      <button data-mode="bot" class="on">vs Bot</button>
      <button data-mode="local">Same device</button>
      <button data-mode="online" disabled title="Coming soon">Online (room code)</button>
    </div>
    <div class="row" id="level-row"><b>Bot level</b>
      <button data-level="easy">Easy</button>
      <button data-level="medium" class="on">Medium</button>
      <button data-level="hard">Hard</button>
    </div>
    <div class="note" id="level-note"></div>
  </div>

  <!-- Game board container -->
  <div class="stage glass">
    <div id="status">Your turn (X)</div>
    <div class="board" id="board"></div>
    <div class="scores"><span id="sx">X: 0</span><span id="sd">Draws: 0</span><span id="so">O: 0</span></div>
    <button id="reset">New round</button>
  </div>

  <footer>MADE BY JUSTMISHCHIEF</footer>
</div>
<script src="js/tictactoe.js"></script>
</body>
</html>
