<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chess · Mini Arcade</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<!-- Supabase SDK, Auth & Online Engine -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/auth.js"></script>
<script src="js/online.js"></script>
<style>
  .room-box {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 16px;
    padding: 16px;
    margin: 14px 0;
    text-align: center;
  }
  .room-code-tag {
    font-size: 32px;
    font-weight: 800;
    letter-spacing: 6px;
    color: #30d158;
    background: rgba(48, 209, 88, 0.12);
    padding: 8px 16px;
    border-radius: 12px;
    display: inline-block;
    margin: 10px 0;
  }
  .room-input {
    width: 140px;
    padding: 10px;
    font-size: 18px;
    font-weight: 700;
    text-align: center;
    text-transform: uppercase;
    letter-spacing: 3px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.2);
    background: rgba(0,0,0,0.2);
    color: #fff;
    outline: none;
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <a href="index.html" class="logo">Mini Arcade</a>
    <div class="topright">
      <span class="pill" id="online-count">● 10 guest passes left</span>
      <button id="auth-btn">Sign in</button>
    </div>
  </div>

  <div class="gamehead"><h1>♞ Chess</h1></div>

  <div class="panel glass" id="setup">
    <div class="row"><b>Mode</b>
      <button data-mode="bot" class="on">vs Bot</button>
      <button data-mode="local">Same device</button>
      <button data-mode="online">Online (room code)</button>
    </div>

    <!-- Online Setup -->
    <div id="online-opts" style="display:none">
      <div class="room-box">
        <p style="margin:0 0 10px; font-size:14px; color:var(--ink2);">Play 1v1 Chess with a friend across screens:</p>
        <div style="display:flex; justify-content:center; gap:10px; margin-bottom:14px;">
          <button class="cta" id="btn-create-room">Create Room</button>
        </div>

        <div style="font-size:12px; color:var(--ink2); margin: 12px 0;">— OR ENTER A ROOM CODE —</div>

        <div style="display:flex; justify-content:center; align-items:center; gap:8px;">
          <input type="text" id="join-code-input" class="room-input" placeholder="CODE" maxlength="4">
          <button class="cta" id="btn-join-room" style="padding:10px 18px;">Join</button>
        </div>

        <div id="online-wait-msg" style="display:none; margin-top:14px;">
          <div style="font-size:13px; color:var(--ink2);">Share code with friend:</div>
          <div class="room-code-tag" id="disp-room-code">----</div>
          <div style="font-size:13px; color:#ff9f0a;">Waiting for friend to join...</div>
        </div>
      </div>
    </div>

    <div class="row" id="bot-row"><b>Bot level</b>
      <button data-level="easy">Easy</button>
      <button data-level="medium" class="on">Medium</button>
      <button data-level="hard">Hard</button>
    </div>
    <div class="row" id="side-row"><b>You play</b>
      <button data-side="w" class="on">White</button>
      <button data-side="b">Black</button>
    </div>
    <!-- Start button: settings first, then the game appears (hidden while playing online, the room code starts that) -->
    <div class="actions" id="start-row"><button class="cta" id="start">Start game</button></div>
  </div>

  <div class="stage glass" id="game" style="display:none">
    <div id="status">White to move</div>
    <div class="chess" id="board"></div>
    <div class="actions">
      <button id="new">New game</button>
      <button id="undo">Undo</button>
      <button id="flip">Flip board</button>
      <button id="change">Change settings</button>
    </div>
  </div>

  <footer>MADE BY JUSTMISHCHIEF</footer>
</div>
<!-- chess-lib.js = the chess.js library (v0.10.3, BSD licence). It handles all the chess rules: legal moves, check, castling, etc. -->
<script src="js/chess-lib.js"></script>
<script src="js/chess.js"></script>
</body>
</html>
